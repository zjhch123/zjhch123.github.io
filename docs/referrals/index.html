<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Referrals</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 0;
            }
            button {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                text-decoration: none;
                border: none;
                cursor: pointer;
                background-color: transparent;
                -webkit-tap-highlight-color: transparent;
            }
            img {
                display: block;
                margin: 0 auto;
                width: 100%;
                height: auto;
            }
        </style>
    </head>
<body>
    <button id="start" data-href=""></button>
    <img src="./page.png" />
    <script>
        function testUserAgent(pattern) {
            const userAgent =
                typeof navigator !== "undefined" ? navigator.userAgent : null;
            return userAgent ? pattern.test(userAgent) : false;
        }
        const isAndroid = testUserAgent(/Android/gi);
        const urlParams = new URLSearchParams(window.location.search);
        const referralCode = urlParams.get('referral-code');
        const button = document.getElementById('start');
        const iosTargetHref = `https://copilot.microsoft.com/referrals/download/?referral-code=${referralCode}`;
        const androidTargetHref = `intent://referralLanding?referral-code=${referralCode}#Intent;scheme=copilotn;package=com.microsoft.copilot;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.microsoft.copilot%26referrer%3Dutm_source%253Dxpay_referral%2526utm_campaign%253D${referralCode};end`;
        const targetHref = isAndroid ? androidTargetHref : iosTargetHref;
        button.setAttribute('data-href', targetHref);
        button.addEventListener('click', () => {
            window.location.href = targetHref;
        });
    </script>
</body>
</html>
