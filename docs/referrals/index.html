<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Referrals</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                margin: 0;
                padding: 0;
            }
            button {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                text-decoration: none;
                border: none;
                cursor: pointer;
                background-color: transparent;
                -webkit-tap-highlight-color: transparent;
            }
            img {
                display: block;
                margin: 0 auto;
                width: 100%;
                height: auto;
            }
        </style>
    </head>
<body>
    <button id="start" data-href=""></button>
    <img src="./page.png" />
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const referralCode = urlParams.get('referral-code');
        const button = document.getElementById('start');
        const targetHref = `https://ercz.adj.st/referralLanding?adj_t=1g3xdna2&adj_deep_link=copilotn%3A%2F%2FreferralLanding&adj_campaign=referral&referral-code=${referralCode}`;
        button.setAttribute('data-href', targetHref);
        button.addEventListener('click', () => {
            window.location.href = targetHref;
        });
    </script>
</body>
</html>
